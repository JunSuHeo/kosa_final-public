name: ${STUDIO_COMPOSE_PROJECT:-planning-studio}
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://studio:studio@db:5432/studio
    APP_ENV: ${APP_ENV:-local}
    AUTH_MODE: ${AUTH_MODE:-mock}
    AI_MODE: ${AI_MODE:-mock}
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: studio, POSTGRES_USER: studio, POSTGRES_PASSWORD: studio}
    ports: ["127.0.0.1:${STUDIO_DB_PORT:-54331}:5432"]
    volumes: ["studio-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    <<: *backend
    command: ["python", "-m", "app.proxy"]
    networks:
      default: {}
      studio-proxy:
        aliases: [studio-proxy-api]
    ports: ["127.0.0.1:${STUDIO_API_PORT:-8010}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
  web:
    build: {context: ., dockerfile: infra/frontend.Dockerfile}
    networks: [studio-proxy]
    ports: ["127.0.0.1:${STUDIO_WEB_PORT:-5174}:80"]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment: {POSTGRES_DB: studio_test, POSTGRES_USER: studio, POSTGRES_PASSWORD: studio}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  test:
    build: {context: ., dockerfile: backend/Dockerfile}
    profiles: [test]
    environment:
      DATABASE_URL: postgresql://studio:studio@test-db:5432/studio_test
      APP_ENV: local
      AUTH_MODE: mock
      AI_MODE: mock
    depends_on: {test-db: {condition: service_healthy}}
    command: ["uv", "run", "--frozen", "pytest", "-q"]
volumes:
  studio-data:
networks:
  default: {}
  studio-proxy: {}
